<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dev Blog</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: #333; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; }
        .post-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 4px solid var(--accent); overflow: hidden; }
        .post-card h2 { margin-top: 0; color: var(--primary); }
        .post-meta { font-size: 0.85em; color: #777; margin-bottom: 15px; }
        .post-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }
        
        .blog-form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        .auth-notice { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Daily Dev Blog</h1>
        <div>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}!</span>
            {% else %}
                <a href="/admin/login/?next=/">Admin Login</a>
            {% endif %}
        </div>
    </header>

    {% if user.is_authenticated %}
    <form class="blog-form" id="blogForm" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" id="title" placeholder="What's the topic today?" required>
        <textarea id="content" placeholder="Share your knowledge..." rows="5" required></textarea>
        <div>
            <label for="image" style="font-size: 0.9em; font-weight: 600; color: #555;">Attach Cover Image (Optional):</label>
            <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit" id="submitBtn">Publish Post</button>
    </form>
    {% else %}
    <div class="auth-notice">
        Only admins can post. <a href="/admin/login/?next=/">Log in here</a> to share a blog.
    </div>
    {% endif %}

    <div id="postsContainer">
        <!-- Posts dynamically rendered here -->
    </div>

    <script>
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
        const postsContainer = document.getElementById('postsContainer');
        const blogForm = document.getElementById('blogForm');
        const submitBtn = document.getElementById('submitBtn');

        // Fetch and display posts
        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts/');
                const posts = await response.json();
                
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<p>No blogs yet. Be the first to post!</p>';
                    return;
                }

                postsContainer.innerHTML = posts.map(post => `
                    <div class="post-card">
                        <h2>${post.title}</h2>
                        <div class="post-meta">Written by <strong>${post.author_name}</strong> on ${new Date(post.created_at).toLocaleDateString()}</div>
                        ${post.image ? `<img src="${post.image}" alt="${post.title}" class="post-image">` : ''}
                        <p>${post.content.replace(/\n/g, '<br>')}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error fetching posts:", error);
            }
        }

        // Handle form submission with FormData
        if (blogForm) {
            blogForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerText = 'Publishing...';

                const formData = new FormData();
                formData.append('title', document.getElementById('title').value);
                formData.append('content', document.getElementById('content').value);
                
                const imageFile = document.getElementById('image').files[0];
                if (imageFile) {
                    formData.append('image', imageFile);
                }

                try {
                    const response = await fetch('/api/posts/', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': csrfToken
                            // Note: Do NOT set Content-Type header when uploading FormData!
                        },
                        body: formData
                    });

                    if (response.ok) {
                        blogForm.reset();
                        fetchPosts();
                    } else {
                        alert('Failed to upload post.');
                    }
                } catch (error) {
                    console.error("Error posting blog:", error);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Publish Post';
                }
            });
        }

        fetchPosts();
    </script>
</body>
</html>
